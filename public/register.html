<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <!-- Page heading -->
    <h2>Register</h2>

    <!-- Registration form: sends the data to the /register endpoint in app.js using a POST request -->
    <form action="/register" method="POST">
        <!-- Each input's name must match what app.js reads from req.body (username, email, password) -->
        <label for="username">Username</label><br>
        <input type="text" name="username" id="username" size="20" required><br>
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email" size="40" required><br>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" size="30" required><br>
        <input type="submit" value="Register">
    </form>

    <!-- Link for users who already have an account -->
    <p>Already registered? <a href="login.html">Login here</a></p>
</body>
</html>
